<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- 共通パーツ:ヘッダー -->
    <nav th:fragment="common_header(title)" class="sticky-top shadow-sm py-2" 
         style="background: linear-gradient(90deg, #F8E1C2 0%, #F5EFE7 50%, #FFFFFF 100%); border-bottom: 2px solid #D7CCC8;">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-7 d-flex align-items-center">
                    <button class="btn d-flex align-items-center justify-content-center mr-3 shadow-sm border-0" 
                            type="button" onclick="openNav()" 
                            style="background: linear-gradient(145deg, #ffffff, #e6e6e6); color: #5d4037; border-radius: 12px; width: 45px; height: 45px; transition: all 0.3s ease;">
                        <i class="fas fa-bars fa-lg"></i>
                    </button>

                    <div class="d-flex align-items-center">
                        <h2 class="mb-0 font-weight-bold" th:text="${title}" 
                            style="background: linear-gradient(45deg, #5d4037, #8d6e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;">
                        </h2>
                        <img th:src="@{/images/R.png}" class="ml-3" style="max-height: 35px; width: auto; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));">
                    </div>
                </div>

                <div class="col-5 d-flex justify-content-end align-items-center">
                    <div class="text-right d-none d-md-block" style="border-right: 1px solid #d7ccc8; padding-right: 15px; margin-right: 15px;">
                        <small class="text-muted d-block" style="text-transform: uppercase; font-size: 0.65rem; font-weight: bold; letter-spacing: 1px;">Active User</small>
                        <span class="font-weight-bold" style="color: #4e342e; font-size: 1rem;" th:text="${session.userName}"></span>
                    </div>
                    <div>
                        <form method="get" action="/ptl102_EV001">
                            <button type="submit" class="btn text-white btn-sm px-4 shadow-sm border-0" 
                                    style="background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%); border-radius: 20px; font-weight: 600; transition: transform 0.2s;">
                                <i class="fas fa-home mr-1"></i> メインへ
                            </button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </nav>

    <!-- ログイン画面用パーツ：ヘッダー -->
    <nav th:fragment="login_header(title)" class="sticky-top shadow-sm py-3" 
         style="background: linear-gradient(90deg, #F8E1C2 0%, #F5EFE7 50%, #FFFFFF 100%); border-bottom: 2px solid #D7CCC8;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-auto d-flex align-items-center">
                    <img th:src="@{/images/R.png}" class="mr-3" style="max-height: 40px; width: auto;">
                    <h2 class="mb-0 font-weight-bold" th:text="${title}" 
                        style="background: linear-gradient(45deg, #5d4037, #8d6e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; font-size: 1.8rem;">
                    </h2>
                </div>
            </div>
        </div>
    </nav>

    <!-- ポータル画面パーツ:ヘッダー -->
    <nav th:fragment="portal_header(title)" class="sticky-top shadow-sm py-2" 
         style="background: linear-gradient(90deg, #F8E1C2 0%, #F5EFE7 50%, #FFFFFF 100%); border-bottom: 2px solid #D7CCC8;">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-7 d-flex align-items-center">
                    <div class="d-flex align-items-center">
                        <h2 class="mb-0 font-weight-bold" th:text="${title}" 
                            style="background: linear-gradient(45deg, #5d4037, #8d6e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;">
                        </h2>
                        <img th:src="@{/images/R.png}" class="ml-3" style="max-height: 35px; width: auto; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));">
                    </div>
                </div>

                <div class="col-5 d-flex justify-content-end align-items-center">
                    <div class="text-right d-none d-md-block" style="border-right: 1px solid #d7ccc8; padding-right: 15px; margin-right: 15px;">
                        <small class="text-muted d-block" style="text-transform: uppercase; font-size: 0.65rem; font-weight: bold; letter-spacing: 1px;">Active User</small>
                        <span class="font-weight-bold" style="color: #4e342e; font-size: 1rem;" th:text="${session.userName}"></span>
                    </div>
                </div>
            </div>

        </div>
    </nav>

</body>
</html>
