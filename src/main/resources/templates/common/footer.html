<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="common_footer" class="py-3" 
            style="background-color: #3E2723; border-top: 2px solid #D7CCC8; color: #D7CCC8;">
        <div class="container text-center">
            <div class="row justify-content-center mb-2">
                <div class="col-auto">
                    <a href="#" class="text-decoration-none mx-3" style="color: #F8E1C2; font-size: 0.85rem;">
                        <i class="fas fa-question-circle mr-1"></i>よくある質問
                    </a>
                    <a href="mailto:support@example.com" class="text-decoration-none mx-3" style="color: #F8E1C2; font-size: 0.85rem;">
                        <i class="fas fa-envelope mr-1"></i>お問い合わせ
                    </a>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-center">
                <img th:src="@{/images/R.png}" class="mr-2" style="max-height: 18px; width: auto; opacity: 0.6; filter: grayscale(100%) brightness(200%);">
                <div class="small opacity-75" style="font-size: 0.75rem;">
                    &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> 
                    <span class="font-weight-bold">Team Harusame.</span>
                </div>
            </div>            
        </div>
    </footer>
</body>
</html>
