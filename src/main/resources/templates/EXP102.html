<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="/css/expenses_common.css">
<link href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" rel="stylesheet">
<title>EXP102:出費照会</title>
</head>
<body>
	<!-- サイドメニュー -->
	<div id="mySidebar" class="sidebar">
	    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
	    <h4 class="text-white ml-4 mb-3">メニュー</h4>
	    <a href="/ptl102_EV001"><i class="fas fa-home mr-2"></i> メインメニュー</a>
	    <a href="/EXP101_EV001"><i class="fas fa-plus-circle mr-2"></i> 出費登録</a>
	    <a href="/EXP102_EV001"><i class="fas fas fa-search mr-2"></i> 出費照会</a>
	    <a href="#"><i class="fas fa-list-alt mr-2"></i> 出費一覧</a>
	    <a href="#"><i class="fas fa-chart-bar mr-2"></i> 月次レポート</a>
	    <div class="dropdown-divider border-secondary mx-3"></div>
        <a href="javascript:void(0);" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
            <i class="fas fa-sign-out-alt mr-2"></i> ログアウト
        </a>
        <form id="logout-form" th:action="@{/logout}" method="POST" style="display: none;"></form>
	</div>

	<!-- サイドバー表示中のオーバーレイ -->
	<div id="sidebar-overlay" class="overlay" onclick="closeNav()"></div>

	<!-- ヘッダー -->
	<div id="main">
		<nav class="sticky-top bd-subnavbar py-1 mb-4 shadow" style="background-color:rgb(248, 225, 194);">
			<div class="container">
				<div class="row mb-1 mt-1">
					<div class="col-6 d-flex align-items-center">
					    <button class="btn mr-3" type="button" onclick="openNav()" style="background-color: #F5EFE7; border-color: #D7CCC8; color: #5D4037;">
					        <span class="navbar-toggler-icon"><i class="fas fa-bars"></i></span>
					    </button>
					    <h1 th:text="#{system.subtitle.expense}"></h1>
					    <img th:src="@{/images/R.png}" class="img-fluid" style="max-height: 40px; width: auto;">
					</div>                    
					<div class="col-6 d-flex justify-content-end align-items-center">
						<div class="me-3 mr-3">
							<h5 th:text="'ログイン者：' + ${session.userName}"></h5>
						</div>
						<div>
							<form method="get" action="/ptl102_EV001">
								<input type="submit" class="btn btn-outline-secondary" value="メインメニューへ戻る"/>
							</form>
						</div>
					</div>
				</div>
			</div>
		</nav>

		<!-- タイトル -->
		<div class="container">
			<div class="row">
				<h3 th:text="#{EXP102.title}"></h3>
			</div>
		</div>

		<!-- 隠しメッセージ -->
		<th:block th:if="${formDto.hdnMsg != null}">
			<div class="container">
				<div class="alert alert-success" role="alert">
				  <p class="m-auto" th:text="${formDto.hdnMsg}"></p>
				</div>
			</div>
		</th:block>
        <!-- エラーメッセージ -->
        <th:block th:if="${errMsg}">
            <div class="container">
                <div class="alert alert-danger" role="alert">
                    <p class="m-auto" th:text="${errMsg}"></p>
                </div>
            </div>
        </th:block>

		<!-- コンテンツエリア -->
		<div class="container shadow-sm pt-4 pb-4 pr-3 pl-3 mb-5 bg-body rounded border border-3" style="background-color: #f5f5f5;">
			<form method="post" action="/EXP102_EV002" th:object="${formDto}">
				<!-- CSRF hidden フィールド -->
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<div class="row">
					<div class="form-group col">
						<label for="pulStore">店舗</label>
						<select th:field="*{storeId}" class="dropdown form-control">
							<option th:each="store : ${formDto.pulStore}" th:value="${store.key}" th:text="${store.value}"></option>
						</select>
					</div>
					<div class="form-group col">
						<label for="pulCategory">種別</label>
						<select th:field="*{categoryId}" class="dropdown form-control">
							<option th:each="category : ${formDto.pulCategory}" th:value="${category.key}" th:text="${category.value}"></option>
						</select>
					</div>
					<div class="form-group col">
						<label for="pulPayer">支払者</label>
						<select th:field="*{payerId}" class="dropdown form-control">
							<option th:each="payer : ${formDto.pulPayer}" th:value="${payer.key}" th:text="${payer.value}"></option>
						</select>
					</div>
				</div>
				<div class="border mb-4"></div>
				<div class="row">
					<div class="form-group col-4">
						<label for="startYMDSearchCondition">開始日(以降)<b class="required"> ＊</b></label>
						<input type="date" name="startYMDSearchCondition" th:value="*{startYMDSearchCondition}" min="2024-08-01" max="2100-12-31" class="form-control" required/>
						<div class="invalid-feedback">開始日(以降)は必須項目です</div>
					</div>
					<div class="form-group col-4">
						<label for="endYMDSearchCondition">終了日(以前)<b class="required"> ＊</b></label>
						<input type="date" name="endYMDSearchCondition" th:value="*{endYMDSearchCondition}" min="2024-08-01" max="2100-12-31" class="form-control" required/>
						<div class="invalid-feedback">終了日(以前)は必須項目です</div>
					</div>
					<div class="form-group col-4">
						<label for="remarksSearchCondition">備考(部分検索)</label>
						<input type="text" name="remarksSearchCondition" th:value="*{remarksSearchCondition}"class="form-control"/>
					</div>
				</div>
				<div class="border mb-3"></div>
				<div class="d-flex justify-content-end">
					<div class="mr-2">
						<input type="button" class="btn btn-outline-success shadow btn-lg" value="クリア"/>
					</div>
					<div class="mr-3">
						<button type="submit" class="btn btn-secondary shadow btn-lg"><i class="fas fa-search"></i> 検索</button>
					</div>
				</div>
			</form>
		</div>
		<th:block th:if="${formDto.resultList != null}">
			<div class="container">
				<h4 class="mb-4">検索結果</h4>
				<table class="table" th:inline="text">
					<thead>
						<tr>
							<th scope="col" style="width: 10%">
								<label for="paymentDate">支払日</label>
							</th>
							<th scope="col" style="width: 15%">
								<label for="amount" class="pl-4">金額</label>
							</th>
							<th scope="col" style="width: 20%">
								<label for="storeNm">店舗</label>
							</th>
							<th scope="col" style="width: 12%">
								<label for="categoryNm">種別</label>
							</th>
							<th scope="col" style="width: 8%">
								<label for="payerNm">支払者</label>
							</th>
							<th scope="col" style="width: 7%">
								<label for="splitStr">分割</label>
							</th>
							<th scope="col" style="width: 22%">
								<label for="remarks">備考</label>
							</th>
							<th scope="col" style="width: 5%">
							</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="entity : ${formDto.resultList}">
							<form method="post" action="/EXP103_EV001" th:object="${entity}">
								<!-- CSRF hidden フィールド -->
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="id" th:value="${entity.id}">
								<th scope="row">
									[[${entity.paymentDate}]]
								</th>
								<td class="text-right pr-5">
									[[${entity.amount}]]円
								</td>
								<td>
									[[${entity.storeNm}]]
								</td>
								<td>
									[[${entity.categoryNm}]]
								</td>
								<td>
									[[${entity.payerNm}]]
								</td>
								<td>
									[[${entity.splitStr}]]
								</td>
								<td>
									[[${entity.remarks}]]
								</td>
								<td>
									<input type="submit" class="btn btn-outline-secondary btn-sm" value="詳細"/>
								</td>
							</form>
						</tr>
						<tr scope="row">
							<th>合計金額</th>
							<td class="text-right pr-5">[[${formDto.sumAmount}]]円</td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</th:block>
	</div> 
	<script src="/js/expenses_common.js"></script>

</body>
</html>
