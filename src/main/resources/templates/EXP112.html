<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="/css/expenses_common.css">
<link href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" rel="stylesheet">
<title>EXP112:種別マスタ管理</title>
</head>
<body>
	<!-- サイドメニュー -->
	<div id="mySidebar" class="sidebar">
	    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
	    <h4 class="text-white ml-4 mb-3">メニュー</h4>
	    <a href="/ptl102_EV001"><i class="fas fa-home mr-2"></i> メインメニュー</a>
	    <a href="/EXP101_EV001"><i class="fas fa-plus-circle mr-2"></i> 出費登録</a>
	    <a href="/EXP102_EV001"><i class="fas fas fa-search mr-2"></i> 出費照会</a>
	    <a href="#"><i class="fas fa-list-alt mr-2"></i> 出費一覧</a>
	    <a href="#"><i class="fas fa-chart-bar mr-2"></i> 月次レポート</a>
	    <div class="dropdown-divider border-secondary mx-3"></div>
        <a href="javascript:void(0);" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
            <i class="fas fa-sign-out-alt mr-2"></i> ログアウト
        </a>
        <form id="logout-form" th:action="@{/logout}" method="POST" style="display: none;"></form>
	</div>

	<!-- サイドバー表示中のオーバーレイ -->
	<div id="sidebar-overlay" class="overlay" onclick="closeNav()"></div>

	<!-- ヘッダー -->
	<div id="main">
		<nav class="sticky-top bd-subnavbar py-1 mb-4 shadow" style="background-color:rgb(248, 225, 194);">
			<div class="container">
				<div class="row mb-1 mt-1">
					<div class="col-6 d-flex align-items-center">
					    <button class="btn mr-3" type="button" onclick="openNav()" style="background-color: #F5EFE7; border-color: #D7CCC8; color: #5D4037;">
					        <span class="navbar-toggler-icon"><i class="fas fa-bars"></i></span>
					    </button>
					    <h1 th:text="#{system.subtitle.expense}"></h1>
					    <img th:src="@{/images/R.png}" class="img-fluid" style="max-height: 40px; width: auto;">
					</div>                    
					<div class="col-6 d-flex justify-content-end align-items-center">
						<div class="me-3 mr-3">
							<h5 th:text="'ログイン者：' + ${session.userName}"></h5>
						</div>
						<div>
							<form method="get" action="/ptl111_EV001">
								<input type="submit" class="btn btn-outline-secondary" value="マスタ管理メニューへ戻る"/>
							</form>
						</div>
					</div>
				</div>
			</div>
		</nav>

		<!-- タイトル -->
		<div class="container">
			<div class="row">
				<h3 th:text="#{EXP112.title}"></h3>
			</div>
		</div>

		<!-- 隠しメッセージ -->
		<th:block th:if="${formDto.hdnMsg != null}">
			<div class="container">
				<div class="alert alert-success" role="alert">
				  <p class="m-auto" th:text="${formDto.hdnMsg}"></p>
				</div>
			</div>
		</th:block>
        <!-- エラーメッセージ -->
        <th:block th:if="${errMsg}">
            <div class="container">
                <div class="alert alert-danger" role="alert">
                    <p class="m-auto" th:text="${errMsg}"></p>
                </div>
            </div>
        </th:block>

		<!-- コンテンツエリア -->
		<div class="container shadow-sm pt-4 pb-4 pr-3 pl-3 mb-5 bg-body rounded border border-3" style="background-color: #f5f5f5;">
			<form method="post" action="/EXP112_EV002" th:object="${formDto}">
				<!-- CSRF hidden フィールド -->
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<div class="row">
					<div class="form-group col-4">
						<label for="categoryName">登録種別名</label>
						<input type="text" th:field="*{categoryName}" class="form-control" maxlength="30" required/>
						<div class="invalid-feedback">種別名は必須項目です</div>
					</div>
				</div>
				<div class="border mb-3"></div>
				<div class="d-flex justify-content-end">
					<div class="mr-2">
						<input type="button" class="btn btn-outline-success shadow btn-lg" value="クリア"/>
					</div>
					<div class="mr-3">
						<button type="submit" class="btn btn-secondary shadow btn-lg"><i class="fas fa-plus"></i> 登録</button>
					</div>
				</div>
			</form>
		</div>
		<th:block th:if="${formDto.tblCategoryList != null}">
			<div class="container">
				<h4 class="mb-4">種別マスタ一覧</h4>
				<table class="table" th:inline="text">
					<thead>
						<tr>
							<th scope="col" style="width: 50%">
								<label for="categoryName">種別名</label>
							</th>
							<th scope="col" style="width: 30%">
								<label for="sortOrder">表示順</label>
							</th>
							<th scope="col" style="width: 10%">
							</th>
							<th scope="col" style="width: 10%">
							</th>
						</tr>
					</thead>
					<tbody>
                        <tr th:each="entity, stat : ${formDto.tblCategoryList}">
                            <form th:id="'form-' + ${stat.index}" method="post" th:object="${entity}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="categoryId" th:value="${entity.categoryId}">

                                <th scope="row">[[${entity.categoryName}]]</th>
                                <td>
                                    <input type="number" name="sortOrder" th:value="${entity.sortOrder}" min="1" max="99" step="1">
                                </td>
                                <td>
                                    <button type="button" class="btn btn-outline-success shadow btn-sm" 
                                            data-toggle="modal" th:data-target="'#updateModal-' + ${stat.index}">更新</button>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-outline-danger shadow btn-sm" 
                                            data-toggle="modal" th:data-target="'#deleteModal-' + ${stat.index}">削除</button>
                                </td>

                                <div class="modal fade" th:id="'updateModal-' + ${stat.index}" tabindex="-1" role="dialog" aria-hidden="true">
                                    <div class="modal-dialog" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">更新確認</h5>
                                                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                                            </div>
                                            <div class="modal-body">[[${entity.categoryName}]] を更新しますか？</div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-outline-primary" data-dismiss="modal">キャンセル</button>
                                                <button type="button" th:onclick="|submitTargetForm('form-${stat.index}', '/EXP112_EV004')|" class="btn btn-outline-success">更新</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="modal fade" th:id="'deleteModal-' + ${stat.index}" tabindex="-1" role="dialog" aria-hidden="true">
                                    <div class="modal-dialog" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">削除確認</h5>
                                                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                                            </div>
                                            <div class="modal-body">[[${entity.categoryName}]] を削除しますか？</div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-outline-primary" data-dismiss="modal">キャンセル</button>
                                                <button type="button" th:onclick="|submitTargetForm('form-${stat.index}', '/EXP112_EV003')|" class="btn btn-outline-danger">削除</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </tr>
					</tbody>
				</table>
			</div>
		</th:block>
	</div> 
	<script src="/js/expenses_common.js"></script>
	<!-- BootstrapのJavaScript -->
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script></body>

</body>
</html>
