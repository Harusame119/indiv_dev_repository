<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/expenses_common.css">
    <link href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" rel="stylesheet">
    <title>PTL101:メインメニュー</title>
    <style>
        /* この画面専用のシンプル調整 */
        .menu-container {
            background-color: #ffffff !important;
            border: 1px solid #D7CCC8 !important;
            border-radius: 15px !important;
        }
        .menu-item-card {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #FDFBF9;
            border: 1px solid #EFEBE9;
            border-radius: 12px;
            color: #5D4037;
            text-decoration: none !important;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .menu-item-card:hover {
            background: #F5EFE7;
            border-color: #D7CCC8;
            transform: translateX(5px);
        }
        .menu-icon {
            font-size: 1.5rem;
            margin-right: 15px;
            color: #8D6E63;
        }
        .menu-title {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{common/sidebar :: common_sidebar}"></div>
    <div id="sidebar-overlay" class="overlay" onclick="closeNav()"></div>

    <div id="main">
        <div th:replace="~{common/header :: common_header(#{system.title})}"></div>

        <div class="container my-4">
            <div class="row d-flex justify-content-between align-items-center">
                <div class="col-auto">
                    <h3 class="page-title" th:text="#{system.title}"></h3>
                </div>
                <div class="col-auto">
                    <form method="post" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-secondary btn-return shadow-sm">
                            <i class="fas fa-sign-out-alt mr-1"></i> ログアウト
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="container menu-container shadow-sm p-4 mb-5">
            <h5 class="mb-4 pb-2 border-bottom" style="color: #8D6E63; font-weight: bold;">
                <i class="fas fa-th-large mr-2"></i>メニューを選択してください
            </h5>
            
            <div class="row">
                <div class="col-md-6">
                    <a href="/ptl102_EV001" class="menu-item-card shadow-sm">
                        <div class="menu-icon">
                            <i class="fas fa-wallet"></i>
                        </div>
                        <div class="menu-title" th:text="#{system.subtitle.expense}"></div>
                        <i class="fas fa-chevron-right ml-auto"></i>
                    </a>

                    </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common/footer :: common_footer}"></div>
    <script src="/js/expenses_common.js"></script>
</body>
</html>
